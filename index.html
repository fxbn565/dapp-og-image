    const template = "0xeBFA119a6dde5DFb840B5F8668Cb5C05F8A012a1";
    const salt = "0x2F640B"; // 截图里的真实盐值

    try {
        // 1. 补齐盐值
        const saltHex = ethers.utils.hexZeroPad(ethers.BigNumber.from(salt).toHexString(), 32);
        
        // 2. 构造 initCode
        const constructorArgs = ethers.utils.defaultAbiCoder.encode(["address", "bytes"], [template, "0x"]);

        const initCodeHash = ethers.utils.keccak256(initCode);
        
        // 3. 计算地址
        const calculatedAddr = ethers.utils.getCreate2Address(factory, saltHex, initCodeHash);
        
        // 4. 显示结果
        const expectedAddr = "0xFbBD26319a500f07711C1fDAd9283aA9C6590090";
        
        let html = `
            <p>算出的地址: <b>${calculatedAddr}</b></p>
            <p>截图上的地址: <b>${expectedAddr}</b></p>
        `;

        if (calculatedAddr.toLowerCase() === expectedAddr.toLowerCase()) {
            html += `<h3 style="color: green;">✅ 完全一致！说明数学公式是对的，你之前绝对是填错参数了。</h3>`;
        } else {
            html += `<h3 style="color: red;">❌ 不一致！这说明你给我发的这段字节码，不是你实际部署中转工厂时用的那个版本。</h3>`;
